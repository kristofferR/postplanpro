name: Upstream

# Imports new postplan npm releases onto the upstream branch and merges them
# into main once the tests pass. The server deploys main by itself, so a
# release goes live soon after its cooldown. Imported code only runs in the
# read-only test job; the jobs holding a write token run nothing but git.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream

env:
  # Compromised npm releases are usually pulled within days; wait that out.
  MIN_RELEASE_AGE_DAYS: 3

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch upstream origin/upstream

      - name: Import a new release
        run: |
          current=$(git show upstream:package.json | jq -r .version)
          latest=$(npm view postplan version)
          published=$(npm view postplan time --json | jq -r --arg v "$latest" '.[$v]')
          age_days=$(( ($(date +%s) - $(date -d "$published" +%s)) / 86400 ))
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" = "$current" ] || [ "$newest" != "$latest" ]; then
            echo "upstream is at $current; npm latest is $latest"
          elif [ "$age_days" -lt "$MIN_RELEASE_AGE_DAYS" ]; then
            echo "postplan $latest is $age_days days old; waiting for $MIN_RELEASE_AGE_DAYS"
          else
            scripts/import-upstream.sh "$latest"
            git push origin upstream
          fi

      # Runs on every schedule until main contains upstream, so a merge that
      # failed once is retried rather than forgotten.
      - name: Merge upstream into main
        id: merge
        run: |
          if git merge-base --is-ancestor upstream HEAD; then
            echo "main already contains upstream"
            exit 0
          fi
          git merge --no-edit upstream
          git push --force origin HEAD:refs/heads/upstream-sync
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bun run test

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # A plain push, so it fails rather than overwrite main if main moved.
      - name: Fast-forward main to the tested merge
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch origin upstream-sync
          git push origin "$SHA:refs/heads/main" ":refs/heads/upstream-sync"

  report:
    needs: [prepare, test, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for a human
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream sync failed"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The scheduled upstream sync failed: $RUN_URL

          It retries daily. If a release did not merge or test cleanly, merge \`origin/upstream\` into main locally, resolve it, run \`bun run test\`, and push."
          fi
