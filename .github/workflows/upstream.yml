name: Upstream

# Imports new postplan npm releases onto the upstream branch and merges them
# into main once the tests pass. The server deploys main by itself, so a release
# goes live soon after its cooldown. A merge that needs a human opens an issue.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream

env:
  # Compromised npm releases are usually pulled within days; wait that out.
  MIN_RELEASE_AGE_DAYS: 3

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch upstream origin/upstream

      - name: Import a new release
        run: |
          current=$(git show upstream:package.json | jq -r .version)
          latest=$(npm view postplan version)
          published=$(npm view postplan time --json | jq -r --arg v "$latest" '.[$v]')
          age_days=$(( ($(date +%s) - $(date -d "$published" +%s)) / 86400 ))
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" = "$current" ] || [ "$newest" != "$latest" ]; then
            echo "upstream is at $current; npm latest is $latest"
          elif [ "$age_days" -lt "$MIN_RELEASE_AGE_DAYS" ]; then
            echo "postplan $latest is $age_days days old; waiting for $MIN_RELEASE_AGE_DAYS"
          else
            scripts/import-upstream.sh "$latest"
            git push origin upstream
          fi

      # Runs on every schedule until main contains upstream, so a merge that
      # failed once is retried rather than forgotten.
      - name: Merge upstream into main
        id: merge
        run: |
          if git merge-base --is-ancestor upstream HEAD; then
            echo "main already contains upstream"
            exit 0
          fi
          echo "version=$(git show upstream:package.json | jq -r .version)" >> "$GITHUB_OUTPUT"
          git merge --no-edit upstream
          bun install
          bun run test
          git push origin HEAD:main

      - name: Report a merge that needs a human
        if: failure() && steps.merge.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.merge.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Merge postplan $VERSION into main"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The scheduled sync imported postplan $VERSION onto \`upstream\`, but merging it into main failed, from a conflict, a failing test, or main moving during the run: $RUN_URL

          Locally: \`git fetch\`, \`git switch main\`, \`git merge origin/upstream\`, resolve, \`bun run test\`, push. The workflow stops retrying once main contains upstream."
          fi
